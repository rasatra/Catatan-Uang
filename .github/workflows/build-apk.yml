name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Salin pustaka Excel ke aplikasi
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js

      - name: Buat proyek Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk catatan-uang.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: catatan-uang-apk
          path: catatan-uang.apk

      - name: Terbitkan APK di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Catatan Uang (versi terbaru)
          files: catatan-uang.apk
          make_latest: true
