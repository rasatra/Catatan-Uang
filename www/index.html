<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Uang – Demo</title>
<style>
:root{--bg:#f3f7f4;--surface:#ffffff;--ink:#16302a;--muted:#5c7168;--line:#dbe6df;--accent:#0f7a5c;--accent-ink:#ffffff;--bubble:#d9f2e4;--warn:#c2410c;--track:#e3ece6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a16;--surface:#16261f;--ink:#e6f1ea;--muted:#9bb2a7;--line:#264036;--accent:#3ccf9b;--accent-ink:#06261b;--bubble:#1d3d30;--warn:#fb923c;--track:#22392f}}
:root[data-theme="dark"]{--bg:#0e1a16;--surface:#16261f;--ink:#e6f1ea;--muted:#9bb2a7;--line:#264036;--accent:#3ccf9b;--accent-ink:#06261b;--bubble:#1d3d30;--warn:#fb923c;--track:#22392f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-size:16px}
main{max-width:560px;margin:0 auto;padding:20px 16px 120px}
h1{font-size:1.1rem;margin:0 0 4px;font-weight:700;color:var(--muted)}
.total{margin:0 0 14px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.total small{display:block;font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;font:inherit;min-width:0}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card .nm{font-weight:700;overflow-wrap:anywhere}
.card .sisa{font-size:1.15rem;font-weight:800;margin:2px 0 8px;overflow-wrap:anywhere}
.card .sisa.over{color:var(--warn)}
.card .of{font-size:.8rem;color:var(--muted);margin-top:6px}
.card.add{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;min-height:100px}
.track{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.fill.warn{background:var(--warn)}
.detail{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.detail .t{font-weight:700}
.detail .i{color:var(--muted);font-size:.88rem}
.acts{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.form{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.form.open{display:flex}
.form input{flex:1 1 120px;min-width:0}
input,button{font-family:inherit;font-size:1rem}
input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.remind{margin-top:14px;background:var(--bubble);border-radius:16px;padding:14px 16px;display:none;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.remind.show{display:flex}
.remind p{margin:0;flex:1 1 200px}
.day{margin:22px 0 8px;color:var(--muted);font-size:.88rem;font-weight:700;text-align:center}
.msg{margin:0 0 10px auto;max-width:88%;background:var(--bubble);border-radius:18px 18px 4px 18px;padding:10px 14px}
.msg .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.msg .desc{font-weight:500;overflow-wrap:anywhere}
.msg .amt{font-weight:800;white-space:nowrap}
.msg .sub{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:2px;font-size:.8rem;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem;padding:4px 0;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.export{margin-top:28px;text-align:center}
.foot{margin-top:14px;text-align:center;color:var(--muted);font-size:.82rem}
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.composer .in{max-width:560px;margin:0 auto}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;border-radius:99px;padding:12px 16px}
.row .btn{border-radius:99px;padding:12px 20px}
.reply{max-width:560px;margin:0 auto 8px;font-size:.9rem}
.reply.show{background:var(--bg);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;animation:pop .25s}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.reply.show{animation:none}.fill{transition:none}}
</style>
</head>
<body>
<main>
  <h1 id="bulan">Catatan Uang</h1>
  <p class="total" id="total"></p>

  <div class="menu" id="menu" role="group" aria-label="Pilih budget"></div>

  <section class="detail" aria-label="Budget terpilih">
    <div class="t" id="dname"></div>
    <div class="i" id="dinfo"></div>
    <div class="acts">
      <button class="linkbtn" id="ubah" type="button">Ubah budget</button>
      <button class="linkbtn" id="hapusP" type="button">Hapus budget ini</button>
    </div>
    <div class="form" id="eform">
      <input id="einput" inputmode="numeric" placeholder="Contoh: 600000" aria-label="Budget dalam rupiah">
      <button class="btn" id="esave" type="button">Simpan</button>
    </div>
  </section>

  <section class="form" id="pform" aria-label="Tambah budget">
    <input id="pname" placeholder="Nama budget, mis. Bensin" aria-label="Nama budget">
    <input id="pbud" inputmode="numeric" placeholder="Jumlah, mis. 400000" aria-label="Jumlah budget">
    <button class="btn" id="psave" type="button">Tambah</button>
  </section>

  <section class="remind" id="remind" aria-live="polite">
    <p>Hari ini belum ada catatan. Tadi ada jajan atau bayar sesuatu?</p>
    <button class="btn" id="catatSekarang" type="button">Catat sekarang</button>
  </section>

  <section id="feed" aria-label="Riwayat catatan"></section>

  <div class="export">
    <button class="btn ghost" id="xl" type="button">Ekspor ke Excel</button>
    <p class="foot" id="xlnote">Satu sheet per budget, ditambah sheet Ringkasan.</p>
  </div>
  <p class="foot">Data tersimpan di HP ini saja.<br><button class="linkbtn" id="reset" type="button">Hapus semua catatan</button></p>
</main>

<div class="composer">
  <div class="reply" id="reply" aria-live="polite"></div>
  <div class="in"><div class="row">
    <input id="msg" autocomplete="off" aria-label="Catat pengeluaran">
    <button class="btn" id="kirim" type="button">Catat</button>
  </div></div>
</div>

<script src="xlsx.full.min.js"></script>
<script>
(function(){
var KEY="catatan-uang-demo-v2";
var state=load();
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items)&&Array.isArray(s.pockets))return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function $(id){return document.getElementById(id)}
function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID")}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function dayKey(t){var d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}

if(!state){
  var now=Date.now(),H=3600000,D=86400000;
  state={active:"jajan",
    pockets:[{id:"pasar",name:"Ke pasar",budget:1500000},{id:"jajan",name:"Jajan",budget:600000},{id:"online",name:"Belanja online",budget:500000}],
    items:[
      {id:1,t:now-D-6*H,p:"pasar",d:"Sayur dan ikan",a:45000},
      {id:2,t:now-D-4*H,p:"pasar",d:"Beras 5 kg",a:70000},
      {id:3,t:now-D-3*H,p:"jajan",d:"Bakso",a:20000},
      {id:4,t:now-D-2*H,p:"online",d:"Case HP",a:65000},
      {id:5,t:now-D-H,p:"jajan",d:"Kopi",a:18000}
    ]};
  save();
}

function parse(text){
  var m=text.match(/(\d[\d.,]*)\s*(rb|ribu|k|jt|juta)?/i);
  if(!m)return null;
  var raw=m[1],unit=(m[2]||"").toLowerCase(),amt;
  if(unit){amt=parseFloat(raw.replace(",","."))*((unit==="jt"||unit==="juta")?1000000:1000)}
  else{amt=parseInt(raw.replace(/[.,]/g,""),10)}
  if(!isFinite(amt)||amt<=0)return null;
  var desc=(text.slice(0,m.index)+" "+text.slice(m.index+m[0].length)).replace(/\s+/g," ").trim()||"Pengeluaran";
  return {d:desc.charAt(0).toUpperCase()+desc.slice(1),a:amt};
}
function monthItems(){
  var n=new Date();
  return state.items.filter(function(i){var d=new Date(i.t);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()});
}
function used(pid){return monthItems().filter(function(i){return i.p===pid}).reduce(function(s,i){return s+i.a},0)}
function active(){
  for(var i=0;i<state.pockets.length;i++){if(state.pockets[i].id===state.active)return state.pockets[i]}
  return state.pockets[0]||null;
}

function render(){
  var a=active();
  $("bulan").textContent="Catatan Uang · "+new Date().toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  var tb=0,tu=0;
  state.pockets.forEach(function(p){tb+=p.budget;tu+=used(p.id)});
  $("total").innerHTML=rp(tb-tu)+"<small>sisa dari total budget "+rp(tb)+"</small>";

  $("menu").innerHTML=state.pockets.map(function(p){
    var u=used(p.id),s=p.budget-u,pct=p.budget>0?Math.min(100,u/p.budget*100):0;
    return '<button class="card" type="button" data-p="'+p.id+'" aria-pressed="'+(a&&a.id===p.id)+'">'+
      '<div class="nm">'+esc(p.name)+'</div>'+
      '<div class="sisa'+(s<0?' over':'')+'">'+(s<0?"−"+rp(-s):rp(s))+'</div>'+
      '<div class="track"><div class="fill'+(pct>=85?' warn':'')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="of">sisa dari '+rp(p.budget)+'</div></button>';
  }).join("")+'<button class="card add" type="button" data-add="1">+ Tambah budget</button>';

  var feed="";
  if(a){
    var u=used(a.id);
    $("dname").textContent="Budget "+a.name;
    $("dinfo").textContent="Terpakai "+rp(u)+" dari "+rp(a.budget);
    $("msg").placeholder="Catat ke "+a.name+", contoh: kopi 18rb";
    var today=dayKey(Date.now()),yest=dayKey(Date.now()-86400000),last="";
    state.items.filter(function(i){return i.p===a.id}).sort(function(x,y){return x.t-y.t}).forEach(function(i){
      var k=dayKey(i.t);
      if(k!==last){last=k;feed+='<div class="day">'+(k===today?"Hari ini":k===yest?"Kemarin":new Date(i.t).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"}))+'</div>'}
      var jam=new Date(i.t).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}).replace(".",":");
      feed+='<div class="msg"><div class="top"><span class="desc">'+esc(i.d)+'</span><span class="amt">'+rp(i.a)+'</span></div>'+
        '<div class="sub"><span>'+jam+'</span><button class="del" data-id="'+i.id+'" type="button">Hapus</button></div></div>';
    });
    if(!feed)feed='<div class="empty">Belum ada catatan di '+esc(a.name)+'. Ketik di bawah, misalnya “kopi 18rb”.</div>';
  }else{
    $("dname").textContent="Belum ada budget";$("dinfo").textContent="Tap “+ Tambah budget” untuk mulai.";
    $("msg").placeholder="Tambah budget dulu";
  }
  $("feed").innerHTML=feed;
  $("hapusP").style.display=state.pockets.length>1?"":"none";
  $("ubah").style.display=a?"":"none";
  var today2=dayKey(Date.now());
  $("remind").className="remind"+(state.items.some(function(i){return dayKey(i.t)===today2})?"":" show");
}

var timer;
function say(t){
  var r=$("reply");r.textContent=t;r.className="reply show";
  clearTimeout(timer);timer=setTimeout(function(){r.className="reply";r.textContent=""},5000);
}
function add(){
  var a=active(),v=$("msg").value.trim();
  if(!a){say("Tambah budget dulu sebelum mencatat.");return}
  if(!v)return;
  var p=parse(v);
  if(!p){say("Belum ada nominalnya. Coba tulis seperti “nasi goreng 25rb”.");return}
  state.items.push({id:Date.now(),t:Date.now(),p:a.id,d:p.d,a:p.a});
  save();$("msg").value="";render();
  var s=a.budget-used(a.id);
  say("Tercatat di "+a.name+": "+p.d+" "+rp(p.a)+". "+(s<0?"Budget ini terlampaui "+rp(-s)+".":"Sisa "+rp(s)+"."));
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

$("kirim").addEventListener("click",add);
$("msg").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("catatSekarang").addEventListener("click",function(){$("msg").focus()});
$("menu").addEventListener("click",function(e){
  var c=e.target.closest("button");if(!c)return;
  if(c.getAttribute("data-add")){$("pform").classList.toggle("open");$("pname").focus();return}
  var id=c.getAttribute("data-p");
  if(id){state.active=id;save();$("eform").classList.remove("open");render()}
});
$("feed").addEventListener("click",function(e){
  var id=e.target.getAttribute("data-id");
  if(id){state.items=state.items.filter(function(i){return String(i.id)!==id});save();render()}
});
$("ubah").addEventListener("click",function(){var a=active();$("eform").classList.toggle("open");$("einput").value=a.budget;$("einput").focus()});
$("esave").addEventListener("click",function(){
  var n=parseInt($("einput").value.replace(/\D/g,""),10),a=active();
  if(n>0&&a){a.budget=n;save();$("eform").classList.remove("open");render()}
});
$("psave").addEventListener("click",function(){
  var nm=$("pname").value.trim(),n=parseInt($("pbud").value.replace(/\D/g,""),10);
  if(!nm){say("Isi nama budget dulu.");return}
  if(!(n>0)){say("Isi jumlah budget dalam angka.");return}
  var id="p"+Date.now();
  state.pockets.push({id:id,name:nm,budget:n});state.active=id;save();
  $("pname").value="";$("pbud").value="";$("pform").classList.remove("open");render();
});
$("hapusP").addEventListener("click",function(){
  var b=$("hapusP"),a=active();
  if(b.getAttribute("data-sure")){
    state.items=state.items.filter(function(i){return i.p!==a.id});
    state.pockets=state.pockets.filter(function(p){return p.id!==a.id});
    state.active=state.pockets[0]?state.pockets[0].id:"";
    save();b.removeAttribute("data-sure");b.textContent="Hapus budget ini";render();
  }else{b.setAttribute("data-sure","1");b.textContent="Yakin? Tap lagi (catatannya ikut terhapus)"}
});
$("reset").addEventListener("click",function(){
  var b=$("reset");
  if(b.getAttribute("data-sure")){state.items=[];save();b.removeAttribute("data-sure");b.textContent="Hapus semua catatan";render()}
  else{b.setAttribute("data-sure","1");b.textContent="Yakin? Tap lagi untuk menghapus"}
});

/* ---------- Ekspor Excel ---------- */
function pad(n){return (n<10?"0":"")+n}
function sheetName(n,usedNames){
  var s=n.replace(/[\\\/\?\*\[\]:]/g,"").slice(0,28)||"Budget",b=s,i=2;
  while(usedNames[s.toLowerCase()]){s=b+" "+(i++)}
  usedNames[s.toLowerCase()]=1;return s;
}
function fmt(ws,addr){if(ws[addr])ws[addr].z='"Rp"#,##0'}
function exportXlsx(){
  if(!window.XLSX){say("Fitur Excel belum termuat. Coba muat ulang halaman.");return}
  var n=new Date(),per=n.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  var wb=XLSX.utils.book_new(),names={ringkasan:1},sheets=[],sumRows=[["Ringkasan budget – "+per],[],["Budget","Anggaran","Terpakai","Sisa"]];
  var tb=0,tu=0;
  state.pockets.forEach(function(p){
    var its=monthItems().filter(function(i){return i.p===p.id}).sort(function(x,y){return x.t-y.t});
    var tot=its.reduce(function(s,i){return s+i.a},0);
    var rows=[["Budget "+p.name+" – "+per],["Anggaran",p.budget],["Terpakai",null],["Sisa",null],[],["Tanggal","Jam","Keterangan","Nominal"]];
    its.forEach(function(i){
      var d=new Date(i.t);
      rows.push([pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(),pad(d.getHours())+":"+pad(d.getMinutes()),i.d,i.a]);
    });
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws["B3"]=its.length?{t:"n",v:tot,f:"SUM(D7:D"+(6+its.length)+")"}:{t:"n",v:0};
    ws["B4"]={t:"n",v:p.budget-tot,f:"B2-B3"};
    ["B2","B3","B4"].forEach(function(a){fmt(ws,a)});
    for(var r=7;r<7+its.length;r++){fmt(ws,"D"+r)}
    ws["!cols"]=[{wch:14},{wch:8},{wch:34},{wch:16}];
    sheets.push({name:sheetName(p.name,names),ws:ws});
    sumRows.push([p.name,p.budget,tot,p.budget-tot]);tb+=p.budget;tu+=tot;
  });
  sumRows.push(["Total",tb,tu,tb-tu]);
  var s=XLSX.utils.aoa_to_sheet(sumRows);
  for(var r=4;r<=3+state.pockets.length+1;r++){["B","C","D"].forEach(function(c){fmt(s,c+r)})}
  s["!cols"]=[{wch:22},{wch:16},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb,s,"Ringkasan");
  sheets.forEach(function(x){XLSX.utils.book_append_sheet(wb,x.ws,x.name)});
  var fname="catatan-uang-"+n.getFullYear()+"-"+pad(n.getMonth()+1)+".xlsx";
  var C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    var b64=XLSX.write(wb,{bookType:"xlsx",type:"base64"});
    C.Plugins.Filesystem.writeFile({path:fname,data:b64,directory:"CACHE"}).then(function(r){
      return C.Plugins.Share.share({title:"Catatan Uang",dialogTitle:"Simpan atau kirim file Excel",url:r.uri});
    }).then(function(){
      say("Pilih tujuan penyimpanan, misalnya File atau Drive.");
    }).catch(function(e){
      if(e&&/cancel/i.test(String(e.message||e)))return;
      say("Gagal menyimpan file Excel. Coba lagi.");
    });
  }else{
    var out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download=fname;document.body.appendChild(a);a.click();a.remove();
  }
}
$("xl").addEventListener("click",exportXlsx);
render();
})();
</script>
</body>
</html>
